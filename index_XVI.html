<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX ANTE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #E2DDD5;
            user-select: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Minimal Overlay UI */
        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 80px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.35em;
            color: #E2DDD5;
            text-transform: uppercase;
        }

        .hero-text {
            max-width: 520px;
        }

        .hero-text p.tagline {
            font-size: 1.25rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            color: #C87D53;
            margin-bottom: 12px;
        }

        .hero-text p.subtext {
            font-size: 0.85rem;
            font-weight: 300;
            line-height: 1.6;
            color: #8A827A;
            letter-spacing: 0.02em;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        #engine-id {
            color: #383430;
        }

        .footer-text {
            color: #8A827A;
            pointer-events: auto;
            cursor: default;
            transition: color 0.3s ease;
        }

        .footer-text:hover {
            color: #C87D53;
        }

        @media (max-width: 768px) {
            .content { padding: 30px; }
            .hero-text p.tagline { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="stage"></canvas>
    </div>

    <div class="content">
        <div class="header">
            <h1>EX ANTE</h1>
        </div>

        <div class="hero-text">
            <p class="tagline">The profit is already in the system.</p>
            <p class="subtext">
                Unlocking hidden organizational yield through stochastic multi-variable modeling and continuous ex-ante simulation.
            </p>
        </div>

        <div class="footer">
            <div id="engine-id">ENGINE // INITIALIZING</div>
            <div class="footer-text">By referral or private agreement only.</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        const engineLabel = document.getElementById('engine-id');

        let width, height;
        let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000, vx: 0, vy: 0, lastX: 0, lastY: 0 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        function updateMouse() {
            mouse.vx = (mouse.targetX - mouse.lastX);
            mouse.vy = (mouse.targetY - mouse.lastY);
            mouse.lastX = mouse.targetX;
            mouse.lastY = mouse.targetY;

            mouse.x += (mouse.targetX - mouse.x) * 0.1;
            mouse.y += (mouse.targetY - mouse.y) * 0.1;
        }

        /* -------------------------------------------------------------
           ENGINE 1: THE TOPOLOGY REVEALER
        ------------------------------------------------------------- */
        class TopologyRevealer {
            constructor() {
                this.name = "SYS // TOPOLOGY_REVEALER";
                this.nodes = [];
                this.numBase = 70;
                this.numLatent = 200;
                this.init();
            }

            init() {
                this.nodes = [];
                for (let i = 0; i < this.numBase; i++) {
                    this.nodes.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        isLatent: false,
                        alpha: 0.4,
                        radius: 3
                    });
                }
                for (let i = 0; i < this.numLatent; i++) {
                    this.nodes.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.2,
                        vy: (Math.random() - 0.5) * 0.2,
                        isLatent: true,
                        alpha: 0,
                        radius: 2
                    });
                }
            }

            render() {
                ctx.fillStyle = '#111111';
                ctx.fillRect(0, 0, width, height);

                const revealRadius = 480;

                this.nodes.forEach(node => {
                    node.x += node.vx;
                    node.y += node.vy;

                    if (node.x < 0 || node.x > width) node.vx *= -1;
                    if (node.y < 0 || node.y > height) node.vy *= -1;

                    if (node.isLatent) {
                        const dx = mouse.x - node.x;
                        const dy = mouse.y - node.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < revealRadius) {
                            const targetAlpha = Math.pow(1 - dist / revealRadius, 2);
                            node.alpha += (targetAlpha - node.alpha) * 0.1;
                        } else {
                            node.alpha += (0 - node.alpha) * 0.05;
                        }
                    }
                });

                for (let i = 0; i < this.nodes.length; i++) {
                    for (let j = i + 1; j < this.nodes.length; j++) {
                        const n1 = this.nodes[i];
                        const n2 = this.nodes[j];

                        if (n1.isLatent && n1.alpha < 0.02 && n2.isLatent && n2.alpha < 0.02) continue;

                        const dx = n1.x - n2.x;
                        const dy = n1.y - n2.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const maxDist = (n1.isLatent || n2.isLatent) ? 220 : 320;

                        if (dist < maxDist) {
                            const edgeAlpha = (1 - dist / maxDist) * Math.min(n1.alpha, n2.alpha);
                            ctx.beginPath();
                            ctx.moveTo(n1.x, n1.y);
                            ctx.lineTo(n2.x, n2.y);

                            if (n1.isLatent || n2.isLatent) {
                                ctx.strokeStyle = `rgba(200, 125, 83, ${edgeAlpha * 0.85})`;
                                ctx.setLineDash([2, 4]);
                            } else {
                                ctx.strokeStyle = `rgba(138, 130, 122, ${edgeAlpha * 0.35})`;
                                ctx.setLineDash([]);
                            }
                            ctx.lineWidth = 1;
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }
                    }
                }

                this.nodes.forEach(node => {
                    if (node.alpha < 0.01) return;
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                    if (node.isLatent) {
                        ctx.fillStyle = `rgba(200, 125, 83, ${node.alpha})`;
                    } else {
                        ctx.fillStyle = `rgba(226, 221, 213, ${node.alpha})`;
                    }
                    ctx.fill();
                });
            }
        }

        /* -------------------------------------------------------------
           ENGINE 2: THE PHASE SPACE ATTRACTOR
        ------------------------------------------------------------- */
        class PhaseSpaceAttractor {
            constructor() {
                this.name = "SYS // PHASE_SPACE_ATTRACTOR";
                this.a = -1.4;
                this.b = 1.6;
                this.c = 1.0;
                this.d = 0.7;

                this.targetA = this.a;
                this.targetB = this.b;
                this.points = 18000;
            }

            render() {
                ctx.fillStyle = 'rgba(17, 17, 17, 0.25)';
                ctx.fillRect(0, 0, width, height);

                this.targetA = -1.4 + (mouse.x / width - 0.5) * 0.8;
                this.targetB = 1.6 + (mouse.y / height - 0.5) * 0.8;

                this.a += (this.targetA - this.a) * 0.03;
                this.b += (this.targetB - this.b) * 0.03;

                let x = 0.1;
                let y = 0.1;

                const scale = Math.min(width, height) * 0.27;
                const cx = width * 0.5;
                const cy = height * 0.5;

                ctx.fillStyle = 'rgba(200, 125, 83, 0.18)';

                for (let i = 0; i < this.points; i++) {
                    let nx = Math.sin(this.a * y) + this.c * Math.cos(this.a * x);
                    let ny = Math.sin(this.b * x) + this.d * Math.cos(this.b * y);

                    x = nx;
                    y = ny;

                    const px = cx + x * scale;
                    const py = cy + y * scale;

                    ctx.fillRect(px, py, 1.4, 1.4);
                }
            }
        }

        /* -------------------------------------------------------------
           ENGINE 3: THE STOCHASTIC ENGINE
        ------------------------------------------------------------- */
        class StochasticEngine {
            constructor() {
                this.name = "SYS // STOCHASTIC_SIMULATOR";
                this.numPaths = 140;
                this.steps = 180;
            }

            render() {
                ctx.fillStyle = '#111111';
                ctx.fillRect(0, 0, width, height);

                const startX = width * 0.08;
                const startY = height * 0.5;
                const stepWidth = (width * 0.84) / this.steps;

                const mu = (mouse.y - height / 2) * -0.0016;
                const sigma = Math.max(0.01, (mouse.x / width) * 0.07);

                let endpoints = [];
                let allPaths = [];

                let seed = 42;
                function random() {
                    let x = Math.sin(seed++) * 10000;
                    return x - Math.floor(x);
                }

                function gaussian() {
                    let u = 0, v = 0;
                    while(u === 0) u = random();
                    while(v === 0) v = random();
                    return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                }

                for (let p = 0; p < this.numPaths; p++) {
                    let path = [{ x: startX, y: startY }];
                    let currentY = startY;

                    for (let s = 0; s < this.steps; s++) {
                        let dw = gaussian();
                        let dy = (mu * 20) + (sigma * dw * 80);
                        currentY -= dy; 
                        path.push({
                            x: startX + (s + 1) * stepWidth,
                            y: currentY
                        });
                    }
                    allPaths.push(path);
                    endpoints.push(currentY);
                }

                ctx.lineWidth = 1;
                for (let p = 0; p < allPaths.length; p++) {
                    ctx.beginPath();
                    ctx.moveTo(allPaths[p][0].x, allPaths[p][0].y);
                    for (let s = 1; s < allPaths[p].length; s++) {
                        ctx.lineTo(allPaths[p][s].x, allPaths[p][s].y);
                    }
                    ctx.strokeStyle = 'rgba(138, 130, 122, 0.09)';
                    ctx.stroke();
                }

                endpoints.sort((a, b) => a - b);
                const p10Index = Math.floor(this.numPaths * 0.1);
                const p90Index = Math.floor(this.numPaths * 0.9);

                for (let p = p10Index; p <= p90Index; p += 4) {
                    ctx.beginPath();
                    ctx.moveTo(allPaths[p][0].x, allPaths[p][0].y);
                    for (let s = 1; s < allPaths[p].length; s++) {
                        ctx.lineTo(allPaths[p][s].x, allPaths[p][s].y);
                    }
                    ctx.strokeStyle = 'rgba(200, 125, 83, 0.38)';
                    ctx.stroke();
                }

                ctx.beginPath();
                ctx.arc(startX, startY, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#C87D53';
                ctx.fill();
            }
        }

        /* -------------------------------------------------------------
           CONTROLLER
        ------------------------------------------------------------- */
        const engines = [
            TopologyRevealer,
            PhaseSpaceAttractor,
            StochasticEngine
        ];

        const SelectedEngineClass = engines[Math.floor(Math.random() * engines.length)];
        const activeEngine = new SelectedEngineClass();

        engineLabel.innerText = activeEngine.name;

        function loop() {
            updateMouse();
            activeEngine.render();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
